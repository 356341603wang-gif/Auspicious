<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#242520" />
    <meta name="description" content="八圣吉祥颂·三遍念诵" />
    <meta property="og:type" content="music.song" />
    <meta property="og:title" content="八圣吉祥颂" />
    <meta property="og:description" content="三遍念诵·纯音频" />
    <meta property="og:image" content="./manjushri-statue.jpg" />
    <title>八圣吉祥颂</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="./manjushri-statue.jpg" fetchpriority="high" />
    <link rel="preload" as="font" href="./noto-serif-tibetan-variable.ttf" crossorigin />
    <link rel="stylesheet" href="./styles.css?v=10" />
    <script type="module" src="./player.js?v=11"></script>
  </head>
  <body>
    <main
      id="resonanceStage"
      class="resonance-stage"
      data-artwork="gilded-manjushri-statue-photo"
    >
      <canvas
        id="resonanceCanvas"
        class="resonance-canvas"
        aria-hidden="true"
      ></canvas>

      <img
        class="resonance-accessible-art"
        src="./manjushri-statue.jpg"
        alt="鎏金文殊菩萨塑像"
        width="3200"
        height="4000"
      />

      <header class="resonance-heading">
        <span>八圣吉祥颂</span>
        <h1 lang="bo">འཕགས་པ་བཀྲ་ཤིས་བརྒྱད་པ།</h1>
        <p>中文颂文·三遍念诵</p>
      </header>

      <aside
        id="lyricsPanel"
        class="resonance-prayer is-resting"
        aria-label="八圣吉祥颂中文同步颂文"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="resonance-prayer-seed" lang="bo" aria-hidden="true">དྷཱིཿ</span>
        <span
          id="lyricRule"
          class="resonance-prayer-rule"
          aria-hidden="true"
        ></span>
        <div class="resonance-prayer-viewport" lang="zh-CN">
          <p
            id="previousLyric"
            class="resonance-prayer-line is-previous"
            aria-hidden="true"
          ></p>
          <p id="currentLyric" class="resonance-prayer-line is-current">
            <span class="resonance-prayer-text resonance-prayer-text-base">嗡 桑巴 Ra 桑巴 Ra 波玛纳萨 Ra</span>
            <span
              class="resonance-prayer-text resonance-prayer-text-fill"
              aria-hidden="true"
            >嗡 桑巴 Ra 桑巴 Ra 波玛纳萨 Ra</span>
          </p>
          <p
            id="nextLyric"
            class="resonance-prayer-line is-next"
            aria-hidden="true"
          >玛哈臧巴巴吽啪德娑哈</p>
        </div>
      </aside>

      <button
        id="resonanceListen"
        type="button"
        class="resonance-listen"
        aria-label="聆听唱诵"
        aria-pressed="false"
      >
        <span class="resonance-listen-icon" aria-hidden="true">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path>
          </svg>
        </span>
        <span class="resonance-listen-copy">
          <span id="resonanceListenLabel" class="resonance-listen-label">开始聆听</span>
          <span id="resonanceListenTime" class="resonance-listen-time">00:00 / 07:18</span>
        </span>
      </button>

      <input
        id="resonanceProgress"
        class="resonance-progress"
        type="range"
        min="0"
        max="438.079"
        step="0.1"
        value="0"
        aria-label="音频进度"
      />

      <div class="resonance-instruction" aria-hidden="true">
        <span>SOUND BECOMES FORM</span>
        <i></i>
      </div>

      <audio
        id="resonanceAudio"
        src="./eight-auspicious-prayer.mp3"
        preload="metadata"
      ></audio>
    </main>
  </body>
</html>
